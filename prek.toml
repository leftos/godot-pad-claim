# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json
default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace", stages = ["pre-commit"] },
    { id = "end-of-file-fixer", stages = ["pre-commit"] },
    { id = "mixed-line-ending", args = ["--fix=lf"], exclude = '\.(bat|cmd)$', stages = ["pre-commit"] },
    { id = "check-merge-conflict", stages = ["pre-commit"] },
    { id = "detect-private-key", stages = ["pre-commit"] },
    { id = "check-added-large-files", args = ["--maxkb=1024"], stages = ["pre-commit"] },
]

[[repos]]
repo = "local"

# Order matters: the fixers run and re-stage first and the readers report on the result, so the commit is checked as it
# will land. `gate csharp format` and the csharpier wrapper `git add` the files they were handed so the commit proceeds
# instead of failing with "files were modified by this hook". The hooks are pwsh because prek launched from PowerShell on
# Windows can hand a bash hook the WSL stub, which has no dotnet.

[[repos.hooks]]
id = "dotnet-format-style"
name = "dotnet format style (info)"
entry = "pwsh -NoProfile -File tools/gate.ps1 csharp format"
language = "system"
types = ["c#"]
require_serial = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "csharpier"
name = "dotnet csharpier format"
entry = "pwsh tools/hooks/csharpier-wrapper.ps1"
language = "system"
types = ["c#"]
require_serial = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "psscriptanalyzer"
name = "PSScriptAnalyzer"
entry = "pwsh tools/hooks/Invoke-ScriptAnalyzerHook.ps1"
language = "system"
types = ["powershell"]
require_serial = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "line-length"
name = "line length (150)"
entry = "pwsh tools/hooks/Test-LineLength.ps1"
language = "system"
types_or = ["c#", "powershell"]
require_serial = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "gitleaks"
name = "gitleaks (staged)"
entry = "gitleaks git --pre-commit --staged --redact --no-banner"
language = "system"
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "padclaim-test"
name = "padclaim.ps1 test (build with warnings as errors, whole suite)"
entry = "pwsh -NoProfile -File padclaim.ps1 test"
language = "system"
pass_filenames = false
# A push of Markdown alone has nothing to test.
exclude = '\.md$'
stages = ["pre-push"]
